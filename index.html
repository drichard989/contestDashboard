<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b2a52" />
  <meta name="description" content="A personal live dashboard for tracking contest NFL picks against live scores." />
  <title>Contest Picks Live Dashboard</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css?v=20260913-22" />
</head>
<body>
  <nav class="player-tabs" aria-label="Player picks">
    <div id="playerTabs" class="player-tabs-inner" role="tablist" aria-label="Choose a player"></div>
  </nav>

  <nav class="view-tabs" aria-label="Dashboard view">
    <div id="viewTabs" class="view-tabs-inner" role="tablist" aria-label="Choose a dashboard view"></div>
  </nav>

  <main id="dashboardContent">
    <section id="statusBanner" class="status-banner hidden" role="status" aria-live="polite"></section>

    <div id="entriesView" class="view-panel">
      <section>
        <div id="entryCards" class="entry-cards"></div>
      </section>

    </div>

    <div id="picksView" class="view-panel hidden">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Entries</th>
              <th scope="col">Pick</th>
              <th scope="col">Game</th>
              <th scope="col">Score / status</th>
              <th scope="col">ATS</th>
              <th scope="col">Margin vs line</th>
            </tr>
          </thead>
          <tbody id="picksBody">
            <tr><td colspan="6" class="empty-table">No picks are configured for this player.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-controls">
      <div class="font-controls" aria-label="Text size controls">
        <span id="fontSizeValue" class="font-size-value">Text size</span>
        <button id="decreaseFontBtn" class="font-size-button" type="button" aria-label="Decrease text size" title="Decrease text size">A−</button>
        <button id="increaseFontBtn" class="font-size-button" type="button" aria-label="Increase text size" title="Increase text size">A+</button>
      </div>
      <span id="lastUpdated" class="last-updated" role="status" aria-live="polite">Waiting for first update</span>
      <button id="refreshBtn" type="button">Refresh scores</button>
    </div>
  </footer>

  <script src="config.js?v=20260913-11"></script>
  <script src="providers/espn.js?v=20260913-7"></script>
  <script src="app.js?v=20260913-24"></script>
</body>
</html>
